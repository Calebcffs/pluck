<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pluck</title>
  <meta name="description" content="Offline reference tones for tuning a guitar by ear.">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eee9e2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pluck">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Pluck</h1>
      <div class="bar">
        <span class="select-wrap">
          <select id="tuning" aria-label="Tuning"></select>
        </span>
        <button id="save" class="btn" type="button" disabled>Save</button>
        <button id="manage" class="btn icon-btn" type="button" aria-label="Manage saved tunings" aria-expanded="false" aria-controls="manage-panel">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </header>

    <form id="save-form" class="card save-form" hidden>
      <label for="save-name" class="card-label">Name this tuning</label>
      <div class="save-row">
        <input id="save-name" type="text" maxlength="40" autocomplete="off" spellcheck="false">
        <button class="btn accent" type="submit">Save</button>
        <button class="btn" type="button" id="save-cancel">Cancel</button>
      </div>
    </form>

    <section id="manage-panel" class="card manage" hidden>
      <div class="card-label">My tunings</div>
      <ul id="saved-list" class="saved-list"></ul>
      <p id="saved-empty" class="empty">Nothing saved yet. Set the strings how you like, then hit Save.</p>
      <div class="manage-actions">
        <button id="export" class="btn" type="button">Export</button>
        <button id="import" class="btn" type="button">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <span id="manage-status" class="status" role="status"></span>
      </div>
    </section>

    <main id="strings" class="strings" aria-label="Strings"></main>

    <button id="strum" class="strum" type="button">Strum</button>

    <div class="loopbar">
      <div class="interval" role="group" aria-label="Loop interval">
        <span class="interval-label">Loop every</span>
        <button type="button" class="seg" data-interval="1.5" aria-pressed="false">1.5s</button>
        <button type="button" class="seg" data-interval="2.5" aria-pressed="true">2.5s</button>
        <button type="button" class="seg" data-interval="4" aria-pressed="false">4s</button>
      </div>
      <button id="stop-all" class="btn stop" type="button" hidden>Stop all</button>
    </div>

    <p class="hint">Keys 1–6 play strings · S to strum</p>
    <p class="hint">Shift+1–6 loops a string · Esc stops loops</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
